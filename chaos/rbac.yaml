kind: ServiceAccount
apiVersion: v1
metadata:
  namespace: boutique
  name: account-boutique-manager-fbcti

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  namespace: boutique
  name: role-boutique-manager-fbcti
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["chaos-mesh.org"]
  resources: [ "*" ]
  verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-boutique-manager-fbcti
  namespace: boutique
subjects:
- kind: ServiceAccount
  name: account-boutique-manager-fbcti
  namespace: boutique
roleRef:
  kind: Role
  name: role-boutique-manager-fbcti
  apiGroup: rbac.authorization.k8s.io