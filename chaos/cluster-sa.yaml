apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: boutique
  name: account-boutique-manager-fbcti

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: role-boutique-manager-fbcti
rules:
- apiGroups: [""]
  resources: ["pods", "namespaces"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["chaos-mesh.org"]
  resources: ["*"]
  verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bind-boutique-manager-fbcti
subjects:
- kind: ServiceAccount
  name: account-boutique-manager-fbcti
  namespace: boutique
roleRef:
  kind: ClusterRole
  name: role-boutique-manager-fbcti
  apiGroup: rbac.authorization.k8s.io